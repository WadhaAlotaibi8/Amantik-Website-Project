<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amantik - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        /* ===== HEADER ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #00408000;
            color: black;
            padding: 10px 30px;
        }

        .logo-section {
            display: flex;
            align-items: center;
        }

        .logo-section img {
            height: 70px;
            margin-right: 15px;
        }

        .logo-section h1 {
            margin: 0;
            font-size: 22px;
        }

        nav a {
            color:black;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ffd700;
        }

        /* ===== BANNER ===== */
        .banner {
            width: 100%;
            height: 300px;
            background-image: url("bannar3.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.6);
        }

        /* ===== FORM STYLE ===== */
        fieldset {
            background-color: white;
            width: 40%;
            margin: 50px auto;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        form div {
            margin-bottom: 15px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #aaa;
            font-size: 14px;
        }

        input[type="submit"] {
            background-color: #004080;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background-color: #002f5f;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 10px;
            background-color: #004080;
            color: white;
        }
    </style>
</head>
<body>

    <!-- ===== HEADER SECTION ===== -->
    <header>
        <div class="logo-section">
            <img src="new-log.jpg" alt="Kuwait University Logo">
            <h1>Amantik – Lost & Found Platform</h1>
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Found Item</a>
            <a href="#">Lost Item</a>
        </nav>
    </header>

    <!-- ===== BANNER SECTION ===== -->
    <div class="banner">
        Welcome to Amantik 
    </div>

    <!-- ===== LOGIN FORM ===== -->
    <form method="post">
        <fieldset>
            <h2>Sign In</h2>
            <div>
                <label for="mail">Email:</label>
                <input id="mail" type="email" placeholder="Enter your email" required>
            </div>

            <div>
                <label for="pass">Password:</label>
                <input id="pass" type="password" placeholder="Enter your password" required>
            </div>

            <input type="submit" value="Login">
        </fieldset> 
    </form> 

    <!-- ===== FOOTER ===== -->
    <footer>
        © 2025 Amantik – Kuwait University Lost & Found Platform
    </footer>
</body>
</html>
